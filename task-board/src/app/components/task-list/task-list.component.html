<div class="task-list">
  <app-search-bar (termChanged)="this.term.set($event)"></app-search-bar>

  <ul class="task-items">
    @for (task of fliteredTasks(); track task.id) {
      <li>
        <app-task-item
          [task]="task"
          [highlightTerm]="this.term()"
          (toggled)="taskService.toggle($event)"
        />
      </li>
    }
  </ul>
</div>
